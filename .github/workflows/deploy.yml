name: Deploy to production

# Déclenchement manuel uniquement pour l'instant, le temps de valider
# le pipeline. Une fois confirmé sans régression sur time2crack.eu,
# ajouter le déclenchement automatique :
#
# on:
#   push:
#     branches: [main]
#   workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply release fixes
        run: python3 scripts/prepare-release.py --root .

      - name: Verify no leftover time2crack.com references
        run: |
          if grep -rl "time2crack\.com" --include="*.html" --include="*.js" \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
              --exclude-dir=scripts --exclude-dir=docs .; then
            echo "::error::time2crack.com references remain after prepare-release.py"
            exit 1
          fi

      - name: Commit and push to codex-site-publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B codex-site-publish
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "deploy: publish main ($(git rev-parse --short HEAD)) with release fixes"
          git push origin codex-site-publish
