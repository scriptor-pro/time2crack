<body>

  <header id="site-header"></header>

  <main>

    <div class="input-section">
      <div class="input-group">
        <label for="pw-input" id="main-title" data-i18n="inputLabel">Test your password</label>
        <input
          id="pw-input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Ex: Password2024!"
          aria-describedby="status"
        />
        <p class="input-hint" id="main-hint">Local, secure, free analysis • Your password never leaves your device</p>
        <p class="input-hint"><small><a href="how-time2crack-works.html" id="how-it-works-link">How does it work? →</a></small></p>
        <p id="hibp-badge" data-state="hidden" role="status" aria-live="polite"></p>
        <div class="quick-result" id="quick-result" hidden>
          <p class="quick-result__text">This password will hold out for: <strong id="quick-result-time"></strong></p>
          <a class="quick-result__more" id="quick-result-more" href="en/results.html">Learn more →</a>
        </div>
      </div>
    </div>

    <!-- Dictionary loading bar -->
    <div id="dict-loader" class="dict-loader" hidden>
      <div class="dict-loader__content">
        <span class="dict-loader__text" id="dict-loader-text">Loading dictionary…</span>
        <div class="dict-loader__bar">
          <div class="dict-loader__progress" id="dict-loader-progress" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <p id="status" aria-live="polite"></p>
